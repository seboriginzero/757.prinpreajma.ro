services:
  app:
    build: .
    image: originzero-tenant-757:latest
    container_name: originzero-tenant-757
    restart: unless-stopped
    env_file:
      - /home/antigravity/secrets/.env.757
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_PORT:-3757}:3000"
    volumes:
      - ./data:/app/data
    networks:
      - 757-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 64
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  757-net:
    driver: bridge

